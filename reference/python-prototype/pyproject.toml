[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listen-cli"
version = "0.1.0"
description = "Read text files and selected sections aloud with local Kokoro TTS"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "kokoro>=0.9.4,<0.10",
    "rich>=13.7,<16",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
listen = "listen_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/listen_cli"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
